version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: store-postgres
    restart: always
    environment:
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_pass
      POSTGRES_DB: store_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      # init SQL se montará para que Postgres lo ejecute al bootstrap
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./inventario-back
      dockerfile: Dockerfile
    container_name: store-backend
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/store_db
      SPRING_DATASOURCE_USERNAME: store_user
      SPRING_DATASOURCE_PASSWORD: store_pass
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
