spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store_db}
    username: ${SPRING_DATASOURCE_USERNAME:store_user}
    password: ${SPRING_DATASOURCE_PASSWORD:store_pass}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
          mode: always

